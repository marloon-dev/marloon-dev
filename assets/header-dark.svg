<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif">
<title>Marlon · desenvolvedor de software</title>
<style>
  @keyframes flutua { 0%,100% { transform: translateY(0) } 50% { transform: translateY(-10px) } }
  @keyframes gira { from { transform: rotate(0deg) } to { transform: rotate(360deg) } }
  @keyframes pisca { 0%,49% { opacity: 1 } 50%,100% { opacity: 0 } }
  @keyframes surge { from { opacity: 0; transform: translateY(14px) } to { opacity: 1; transform: none } }
  .flutua { animation: flutua 6s ease-in-out infinite; transform-box: fill-box; transform-origin: center }
  .flutua2 { animation: flutua 8s ease-in-out infinite reverse; transform-box: fill-box; transform-origin: center }
  .gira { animation: gira 60s linear infinite; transform-box: fill-box; transform-origin: center }
  .cursor { animation: pisca 1.1s step-end infinite }
  .s1 { animation: surge .8s ease-out both }
  .s2 { animation: surge .8s .15s ease-out both }
  .s3 { animation: surge .8s .3s ease-out both }
  .s4 { animation: surge .8s .45s ease-out both }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important } }
</style>
<defs>
  <linearGradient id="fundo" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#141712"/><stop offset="1" stop-color="#1d2617"/></linearGradient>
  <linearGradient id="nome" x1="0" x2="1"><stop offset="0" stop-color="#3fbf83"/><stop offset=".55" stop-color="#a6d63c"/><stop offset="1" stop-color="#ef5b80"/></linearGradient>
  <clipPath id="borda"><rect width="1200" height="320" rx="24"/></clipPath>
</defs>
<g clip-path="url(#borda)">
  <rect width="1200" height="320" fill="url(#fundo)"/>
  <circle class="flutua2" cx="1090" cy="40" r="170" fill="#3a1f28"/>
  <circle class="flutua" cx="930" cy="330" r="120" fill="#232a1e"/>
  <g class="flutua"><path transform="translate(1010 190) rotate(-35) scale(0.9)" fill="#3fbf83" d="M0 0 C 30 -40, 90 -40, 120 0 C 90 40, 30 40, 0 0 Z"/></g>
  <g class="flutua2"><path transform="translate(860 110) rotate(20) scale(0.55)" fill="#a6d63c" d="M0 0 C 30 -40, 90 -40, 120 0 C 90 40, 30 40, 0 0 Z"/></g>
  <g class="flutua"><path transform="translate(1120 250) rotate(200) scale(0.5)" fill="#ef5b80" d="M0 0 C 30 -40, 90 -40, 120 0 C 90 40, 30 40, 0 0 Z"/></g>
  <text class="s1" x="72" y="96" font-size="22" font-weight="600" fill="#8a9384" letter-spacing="3">OLÁ, EU SOU O</text>
  <text class="s2" x="68" y="182" font-size="92" font-weight="800" fill="url(#nome)" letter-spacing="-2">Marlon<tspan fill="#ef5b80">.</tspan></text>
  <g class="s3"><text x="72" y="228" font-size="24" font-weight="500" fill="#b9c1b3">Desenvolvedor de software · apps nativos, web e automação</text>
</g>
  <g class="s4"><g><rect x="72" y="254" width="95" height="34" rx="17" fill="#1f241c" stroke="#333a2e"/><circle cx="89" cy="271" r="5" fill="#ef5b80"/><text x="101" y="276.5" font-size="15" font-weight="600" fill="#b9c1b3">Swift</text></g><g><rect x="185.0" y="254" width="142" height="34" rx="17" fill="#1f241c" stroke="#333a2e"/><circle cx="202.0" cy="271" r="5" fill="#a6d63c"/><text x="214.0" y="276.5" font-size="15" font-weight="600" fill="#b9c1b3">TypeScript</text></g><g><rect x="345.0" y="254" width="86" height="34" rx="17" fill="#1f241c" stroke="#333a2e"/><circle cx="362.0" cy="271" r="5" fill="#3fbf83"/><text x="374.0" y="276.5" font-size="15" font-weight="600" fill="#b9c1b3">Rust</text></g><g><rect x="448.6" y="254" width="104" height="34" rx="17" fill="#1f241c" stroke="#333a2e"/><circle cx="465.6" cy="271" r="5" fill="#ef5b80"/><text x="477.6" y="276.5" font-size="15" font-weight="600" fill="#b9c1b3">Python</text></g></g>
</g>
</svg>
